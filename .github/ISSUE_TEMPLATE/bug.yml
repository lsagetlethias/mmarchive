name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      description: Redact the token. Never paste it in an issue.
      render: shell
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `node --version` and the Mattermost server version.
    validations:
      required: true
  - type: textarea
    id: manifest
    attributes:
      label: Manifest excerpt
      description: >
        If the archive exists, the `counts` and `warnings` sections of
        manifest.json help a lot. Remove anything identifying.
      render: json
